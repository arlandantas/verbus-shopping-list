name: Deploy to GitHub Pages

# Publishes the static build. Base path is derived from the repo name (see Build step).
# Needs repository variables (Settings > Secrets and variables > Actions > Variables):
# VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID.
# These web-config values are public by design; real protection is firestore.rules.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Firebase config
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository variable $v"; exit 1; fi
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Project pages live under /<repo>/; the <user>.github.io repo is served at the root.
      - name: Build
        run: |
          case "$GITHUB_REPOSITORY" in
            *.github.io) export VITE_BASE=/ ;;
            *) export VITE_BASE="/${GITHUB_REPOSITORY#*/}/" ;;
          esac
          pnpm build # also writes dist/404.html (SPA fallback for deep links on Pages)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
